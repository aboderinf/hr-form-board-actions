function ensureCustomTimeControls(){const select=document.getElementById("lab-slice-gameTime");if(!select)return;const existing=document.getElementById("discovery-custom-time-controls");if(select.value!=="custom"){existing?.remove();return;}if(existing)return;const wrap=document.createElement("div");wrap.id="discovery-custom-time-controls";wrap.style.cssText="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;flex:1 1 100%;";wrap.innerHTML=`<label style="font-size:.875rem;font-weight:700;flex:1 1 170px">Custom start · ET<input id="lab-game-time-start" type="time" value="${customStart}" style="display:block;box-sizing:border-box;width:100%;margin-top:6px;min-height:42px;padding:9px 10px;border:1px solid var(--line,#e5e7eb);border-radius:8px;background:var(--panel,#0d1a24);color:inherit;font:inherit;font-size:1rem"></label><label style="font-size:.875rem;font-weight:700;flex:1 1 170px">Custom end · ET<input id="lab-game-time-end" type="time" value="${customEnd}" style="display:block;box-sizing:border-box;width:100%;margin-top:6px;min-height:42px;padding:9px 10px;border:1px solid var(--line,#e5e7eb);border-radius:8px;background:var(--panel,#0d1a24);color:inherit;font:inherit;font-size:1rem"></label><div id="lab-game-time-error" class="muted" style="flex:1 1 100%;font-size:.8rem"></div>`;select.closest(".discovery-slice-controls")?.appendChild(wrap);const error=wrap.querySelector("#lab-game-time-error");wrap.querySelector("#lab-game-time-start")?.addEventListener("change",(e)=>{customStart=e.target.value;apply(select,error);});wrap.querySelector("#lab-game-time-end")?.addEventListener("change",(e)=>{customEnd=e.target.value;apply(select,error);});}
