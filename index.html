<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Form Board — GitHub Actions</title><style>:root{--bg:#061018;--p:#0d1a24;--l:#223847;--t:#ecf5f8;--m:#91a7b5;--a:#66e7b1;--g:#ffca5c;--r:#ff8585}*{box-sizing:border-box}body{margin:0;background:#061018;color:var(--t);font:15px/1.5 system-ui}.s{max-width:1320px;margin:auto;padding:22px}.c{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:20px;margin:16px 0}.h{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}h1{font-size:54px;line-height:1;margin:12px 0}h2{margin:0 0 12px}.a{color:var(--a)}.m{color:var(--m)}.n{border-left:3px solid var(--g);padding:12px;background:#1b201c}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}.tw{overflow:auto}button{padding:8px 12px;border-radius:99px;border:1px solid var(--l);background:#102432;color:var(--t)}button.on{background:var(--a);color:#042017}@media(max-width:850px){.h,.g{grid-template-columns:1fr}}</style></head><body data-j="{&quot;generated_at&quot;: null, &quot;method&quot;: &quot;0.50*(L5 HR-game rate)+0.30*(L7 HR-game rate)+0.20*(L15 HR-game rate)&quot;, &quot;checkpoints_et&quot;: [&quot;08:17&quot;, &quot;11:17&quot;, &quot;17:17&quot;, &quot;20:17&quot;], &quot;aggregate&quot;: {&quot;top10&quot;: {&quot;selections&quot;: 0, &quot;settled&quot;: 0, &quot;wins&quot;: 0, &quot;losses&quot;: 0, &quot;pushes&quot;: 0, &quot;hit_rate&quot;: null, &quot;net_units&quot;: 0.0, &quot;roi&quot;: null}, &quot;top20&quot;: {&quot;selections&quot;: 0, &quot;settled&quot;: 0, &quot;wins&quot;: 0, &quot;losses&quot;: 0, &quot;pushes&quot;: 0, &quot;hit_rate&quot;: null, &quot;net_units&quot;: 0.0, &quot;roi&quot;: null}}, &quot;snapshots&quot;: []}"><div id="x"></div><script>const D=JSON.parse(document.body.dataset.j);let P='top10';const q=v=>v==null?'—':(v>=0?'+':'')+(v*100).toFixed(1)+'%',u=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'u',o=v=>v>0?'+'+v:v;function M(s){return `<div class=g><div class=c><b>${s.wins}–${s.losses}</b><div class=m>Record</div></div><div class=c><b>${q(s.hit_rate)}</b><div class=m>Hit rate</div></div><div class=c><b>${u(s.net_units)}</b><div class=m>Net units</div></div><div class=c><b>${q(s.roi)}</b><div class=m>ROI</div></div></div>`}function R(p){return p.map(x=>`<tr><td>${x.rank}</td><td><b>${x.player}</b></td><td>${x.score.toFixed(4)}</td><td>${x.hr_games_l5}/${x.hr_games_l7}/${x.hr_games_l15}</td><td class=a>${o(x.odds)}</td><td>${x.sportsbook}</td><td>${x.dk_odds==null?'Unverified':o(x.dk_odds)}</td><td>${x.game_time_et||'—'}</td><td>${x.result}</td><td>${x.profit_units==null?'—':u(x.profit_units)}</td></tr>`).join('')}function draw(){let a=D.aggregate[P]||{wins:0,losses:0,hit_rate:null,net_units:0,roi:null};let s=[...D.snapshots].reverse();x.innerHTML=`<div class=s><div class=m>Independent from ChatGPT Scheduled Tasks</div><section class=h><div class=c><div class=a>GitHub Actions edition</div><h1>Four checks.<br>Frozen forever.</h1><p class=m>Corrected cumulative L5/L7/L15 scoring with DraftKings comparison and best-book labels.</p><div class=n>8:17 AM, 11:17 AM, 5:17 PM and 8:17 PM ET.</div></div><div class=c><h2>All-time ${P==='top10'?'Top 10':'Top 20'}</h2><button data-p=top10 class="${P==='top10'?'on':''}">Top 10</button> <button data-p=top20 class="${P==='top20'?'on':''}">Top 20</button>${M(a)}</div></section><section class=c><h2>Immutable snapshots</h2>${s.length?s.map(z=>{let f=z.portfolios?.[P];return `<div class=c><h2>${z.slate_date} · ${z.checkpoint_et} ET</h2><p class=m>${z.status} · captured ${z.observed_at_et||'—'}</p>${f?M(f.summary):''}${f?.picks?.length?`<div class=tw><table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>L5/L7/L15</th><th>Odds</th><th>Book</th><th>DK</th><th>Game</th><th>Result</th><th>P/L</th></tr></thead><tbody>${R(f.picks)}</tbody></table></div>`:''}</div>`}).join(''):'<div class=n>No Action-generated snapshot committed yet.</div>'}</section></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;draw()})}draw();</script></body></html>
