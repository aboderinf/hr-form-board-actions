<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MLB 2+ Total Bases Board</title>
  <meta name="description" content="MLB batter 2+ total-bases form board with archived sportsbook prices, discovery, and a leakage-safe model path." />
  <link rel="stylesheet" href="/strikeouts.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">MLB BATTER PROPS</div>
        <h1>2+ Total Bases</h1>
        <p class="sub">Form first. Discovery from archived Over 1.5 prices. Predictive model only after strict out-of-sample validation.</p>
      </div>
      <a class="back" href="/strikeouts.html">Strikeouts Board ↗</a>
    </header>

    <section class="tabs" aria-label="Board views">
      <button class="tab active" data-view="form">Form</button>
      <button class="tab" data-view="discovery">Discovery</button>
      <button class="tab" data-view="model">Model</button>
    </section>

    <section class="toolbar" id="form-toolbar">
      <div class="date-wrap"><span>Slate</span><input id="slate-date" type="date" /></div>
      <div class="checkpoint-wrap">
        <span>Checkpoint</span>
        <select id="checkpoint">
          <option value="">Latest archived</option>
          <option value="0817">8:17 AM</option>
          <option value="1117">11:17 AM</option>
          <option value="1717">5:17 PM</option>
          <option value="2017">8:17 PM</option>
        </select>
      </div>
      <button id="refresh">Refresh</button>
    </section>

    <section id="status" class="status-card">Loading today’s 2+ total-bases board…</section>
    <section id="summary" class="summary-grid" hidden></section>
    <section id="content"></section>
  </main>
  <script type="module" src="/total-bases.js"></script>
</body>
</html>
