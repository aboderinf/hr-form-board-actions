name: Record August 4 backfill status

on:
  push:
    branches: [main]
    paths:
      - "data/triggers/record-backfill-status.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record recent final recovery runs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backfill-2026-08-04-1117-final.yml',
              per_page: 5
            });
            const runs = response.data.workflow_runs.map(run => ({
              id: String(run.id), event: run.event, status: run.status,
              conclusion: run.conclusion, run_started_at: run.run_started_at,
              created_at: run.created_at, updated_at: run.updated_at,
              head_sha: run.head_sha, html_url: run.html_url
            }));
            fs.mkdirSync('data/status', { recursive: true });
            fs.writeFileSync('data/status/backfill-2026-08-04-1117-final-runs.json', JSON.stringify({
              recorded_at: new Date().toISOString(), runs
            }, null, 2) + '\n');
      - name: Commit status
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status/backfill-2026-08-04-1117-final-runs.json
          git commit -m "Record final August 4 recovery status"
          git pull --rebase origin main
          git push
