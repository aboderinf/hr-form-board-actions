name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - name: Compile tracker modules
        run: python -m py_compile src/*.py scripts/*.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Test archived triples projection
        run: node --test tests/test_triples_runtime.js
      - name: Test archived total-bases projection
        run: node --test tests/test_total_bases_runtime.js
      - name: Check total-bases API syntax
        run: node --check lib/total-bases-runtime.js && node --check api/total-bases-odds.js && node --check api/total-bases-form.js
