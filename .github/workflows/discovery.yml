name: Archive Top 100 Discovery

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Optional YYYY-MM-DD slate date
        required: false
      checkpoint:
        description: Optional exact checkpoint (0817, 1117, 1717, 2017)
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/discovery.yml"
      - "api/capture-checkpoint.js"
      - "api/central-odds.js"
      - "lib/discovery-runtime.js"
      - "scripts/export_discovery_checkpoint.py"
      - "scripts/build_discovery.py"
      - "src/discovery.py"
      - "tests/test_discovery.py"
  schedule:
    # GitHub cron is UTC. Each pair covers EDT and EST. The resolver below
    # uses America/New_York time and also recovers any earlier missing archive.
    - cron: '45 12,13 * * *'
    - cron: '45 15,16 * * *'
    - cron: '45 21,22 * * *'
    - cron: '45 0,1 * * *'

permissions:
  contents: write

concurrency:
  group: top-100-discovery-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve due and missing ET checkpoints
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DATE: ${{ github.event.inputs.slate_date }}
          MANUAL_CHECKPOINT: ${{ github.event.inputs.checkpoint }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from datetime import datetime, time, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          et = ZoneInfo("America/New_York")
          now = datetime.now(et)
          manual_date = os.environ.get("MANUAL_DATE", "").strip()
          manual_cp = re.sub(r"\D", "", os.environ.get("MANUAL_CHECKPOINT", "")).zfill(4)
          valid = ["0817", "1117", "1717", "2017"]
          slate_date = manual_date or now.date().isoformat()

          if manual_cp in valid:
              due = [manual_cp]
          else:
              due = []
              for cp in valid:
                  hour, minute = int(cp[:2]), int(cp[2:])
                  scheduled = datetime.combine(now.date(), time(hour, minute), et)
                  if scheduled > now:
                      continue
                  archive = Path("data/discovery/archive") / f"{slate_date}_{cp}.json"
                  # Reconcile a checkpoint shortly after it is due, and recover
                  # any older checkpoint that is still missing from the Git archive.
                  if not archive.exists() or now - scheduled <= timedelta(minutes=90):
                      due.append(cp)

          print(f"due={'true' if due else 'false'}")
          print(f"checkpoints={' '.join(due)}")
          print(f"slate_date={slate_date}")
          print(f"observed_et={now.isoformat()}")
          PY

      - name: Skip when no checkpoint needs reconciliation
        if: steps.window.outputs.due != 'true'
        run: echo "No Discovery checkpoint needs reconciliation at ${{ steps.window.outputs.observed_et }}."

      - uses: actions/setup-python@v5
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Export every due canonical Redis Discovery checkpoint
        if: steps.window.outputs.due == 'true'
        shell: bash
        env:
          CHECKPOINTS: ${{ steps.window.outputs.checkpoints }}
          SLATE_DATE: ${{ steps.window.outputs.slate_date }}
        run: |
          set -u
          failed=0
          for checkpoint in $CHECKPOINTS; do
            ok=0
            for attempt in 1 2 3; do
              if python scripts/export_discovery_checkpoint.py \
                --date "$SLATE_DATE" \
                --checkpoint "$checkpoint"; then
                ok=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Discovery $checkpoint export attempt $attempt failed; retrying canonical Redis projection."
                sleep $((attempt * 20))
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "::warning::Discovery $checkpoint could not be reconciled from canonical storage on this run."
              failed=$((failed + 1))
            fi
          done
          echo "Discovery reconciliation completed with $failed unresolved checkpoint(s)."
          # Successful checkpoints must still be tested/committed even if a different
          # checkpoint remains unavailable. Future runs will retry anything missing.
          exit 0

      - name: Run only Discovery archive tests
        if: steps.window.outputs.due == 'true'
        run: python -m unittest discover -s tests -p 'test_discovery.py' -v

      - name: Commit reconciled Discovery archive
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/discovery.json data/discovery/archive
          git commit -m "Archive Top 100 discovery checkpoint"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
