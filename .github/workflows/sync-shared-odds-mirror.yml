name: Apply captured checkpoint to Form Board

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Optional YYYY-MM-DD slate date
        required: false
      checkpoint:
        description: Optional ET checkpoint (08:17, 11:17, 17:17, 20:17)
        required: false
  push:
    branches: [main]
    paths:
      - "data/triggers/run-source-driven-refresh-now.txt"
  schedule:
    - cron: "20 8 * * *"
      timezone: "America/New_York"
    - cron: "20 11 * * *"
      timezone: "America/New_York"
    - cron: "20 17 * * *"
      timezone: "America/New_York"
    - cron: "20 20 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: form-board-redis-consumer-${{ github.event.inputs.slate_date || github.event.schedule || 'manual' }}-${{ github.event.inputs.checkpoint || 'scheduled' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve intended ET checkpoint
        id: window
        shell: bash
        env:
          REQUESTED_DATE: ${{ github.event.inputs.slate_date }}
          REQUESTED_CHECKPOINT: ${{ github.event.inputs.checkpoint }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          ET = ZoneInfo("America/New_York")
          now = datetime.now(timezone.utc).astimezone(ET)
          labels = {8:"08:17", 11:"11:17", 17:"17:17", 20:"20:17"}
          requested = os.environ.get("REQUESTED_CHECKPOINT", "").strip()
          requested_date = os.environ.get("REQUESTED_DATE", "").strip()
          schedule = os.environ.get("SCHEDULE_EXPR", "").strip()
          if requested:
              digits = re.sub(r"\D", "", requested).zfill(4)
              checkpoint = f"{digits[:2]}:{digits[2:]}"
              if checkpoint not in labels.values(): raise SystemExit("invalid checkpoint")
              slate_date = requested_date or now.date().isoformat()
          elif schedule:
              hour = int(schedule.split()[1])
              checkpoint = labels[hour]
              candidate = now.replace(hour=hour, minute=20, second=0, microsecond=0)
              if candidate > now + timedelta(hours=2): candidate -= timedelta(days=1)
              slate_date = candidate.date().isoformat()
          else:
              eligible = [h for h in labels if h < now.hour or (h == now.hour and now.minute >= 17)]
              hour = max(eligible) if eligible else 20
              slate_date = requested_date or (now.date() if eligible else (now - timedelta(days=1)).date()).isoformat()
              checkpoint = labels[hour]
          print(f"slate_date={slate_date}")
          print(f"checkpoint={checkpoint}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install consumer runtime
        run: pip install -r requirements.txt

      - name: Materialize exact Redis checkpoint
        run: |
          python scripts/sync_upstash_checkpoint.py \
            --date "${{ steps.window.outputs.slate_date }}" \
            --checkpoint "${{ steps.window.outputs.checkpoint }}" \
            --attempts 40 --delay 15

      - name: Score immutable checkpoint
        run: |
          python scripts/run_checkpoint_from_cache.py \
            --date "${{ steps.window.outputs.slate_date }}" \
            --checkpoint "${{ steps.window.outputs.checkpoint }}" \
            --force

      - name: Refresh Top 100 from same checkpoint
        run: |
          python scripts/build_top100.py --date "${{ steps.window.outputs.slate_date }}" --odds-only
          python scripts/capture_top100_checkpoint.py \
            --date "${{ steps.window.outputs.slate_date }}" \
            --checkpoint "${{ steps.window.outputs.checkpoint }}"

      - name: Refresh Today board from same checkpoint
        id: today
        continue-on-error: true
        run: |
          python scripts/refresh_latest.py \
            --cache data/shared-odds/latest.json \
            --date "${{ steps.window.outputs.slate_date }}" \
            --checkpoint "${{ steps.window.outputs.checkpoint }}"

      - name: Record successful pipeline status
        env:
          SLATE_DATE: ${{ steps.window.outputs.slate_date }}
          CHECKPOINT: ${{ steps.window.outputs.checkpoint }}
          TODAY_REFRESH_OUTCOME: ${{ steps.today.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          source = json.loads(Path("data/shared-odds/latest.json").read_text())
          payload = {
              "schema_version": 4,
              "status": "success",
              "source": "upstash-qstash-vercel",
              "slate_date": os.environ["SLATE_DATE"],
              "checkpoint_label": os.environ["CHECKPOINT"],
              "provider_call_id": source.get("providerCallId"),
              "provider_response_sha256": source.get("providerResponseSha256"),
              "quote_count": source.get("quoteCount", 0),
              "today_board_refresh": os.environ.get("TODAY_REFRESH_OUTCOME"),
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
          }
          Path("data/pipeline-status.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Commit board update
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply exact Upstash checkpoint to Form Board"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
