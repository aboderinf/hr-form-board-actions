name: Recent HR Rule Forward Tracker

on:
  workflow_dispatch:
  schedule:
    # Run after 11:17 AM ET in either daylight or standard time. The job is idempotent.
    - cron: "25 15 * * *"
    - cron: "25 16 * * *"
    # Morning grading/reconciliation of prior picks.
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: recent-hr-rule-forward-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build picks and grade ledger
        run: python scripts/build_recent_hr_rule.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('data/recent-hr-rule/latest.json').read_text())
          ledger=json.loads(Path('data/recent-hr-rule/ledger.json').read_text())
          assert latest['rule_id']=='rank3-most-recent-hr-lag2-1117'
          assert ledger['rule_id']==latest['rule_id']
          assert ledger['rule']['checkpoint']=='1117'
          print('status', latest['status'], 'picks', len(latest.get('picks', [])))
          print('summary', ledger.get('summary'))
          PY
      - name: Commit forward tracker outputs
        shell: bash
        run: |
          git config user.name "recent-hr-rule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recent-hr-rule/latest.json data/recent-hr-rule/ledger.json
          if git diff --cached --quiet; then
            echo "No tracker changes"
            exit 0
          fi
          git commit -m "Update recent-HR forward picks and ledger"
          git pull --rebase origin main
          git push origin main
