name: Repair 2026-08-02 5:17 checkpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-2026-08-02-1717.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-2026-08-02-1717
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate recovery, capture grace, and shell protections
        run: python -m unittest discover -s tests -v
      - name: Rebuild the failed 5:17 PM checkpoint
        run: python scripts/run_checkpoint.py --date 2026-08-02 --checkpoint 17:17 --force
      - name: Commit recovered checkpoint
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No repair changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git commit -m "Repair 5:17 HR form checkpoint"
          git pull --rebase origin main
          git push
