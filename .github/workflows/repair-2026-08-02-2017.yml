name: Repair 2026-08-02 8:17 checkpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-2026-08-02-2017.yml"
      - "src/edge_source.py"
      - "tests/test_public_mirror_fallback.py"
      - "data/shared-odds/**"

permissions:
  contents: write

concurrency:
  group: repair-2026-08-02-2017
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for public Form Board mirror deployment
        run: |
          python - <<'PY'
          import json, time
          from urllib.request import urlopen
          url = "https://hr-form-board-actions.vercel.app/data/shared-odds/archive/2026-08-02_2017.json"
          last = None
          for _ in range(18):
              try:
                  with urlopen(url, timeout=10) as response:
                      payload = json.load(response)
                  if payload.get("providerCallId") and payload.get("source") == "mlb-hr-edge-database":
                      print(json.dumps(payload, indent=2))
                      break
              except Exception as exc:
                  last = exc
              time.sleep(10)
          else:
              raise SystemExit(f"Public mirror unavailable: {last}")
          PY
      - name: Run all consumer tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild immutable 8:17 checkpoint
        run: python scripts/run_checkpoint.py --date 2026-08-02 --checkpoint 20:17 --force
      - name: Commit repaired checkpoint
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "No repair changes."
            exit 0
          fi
          git commit -m "Repair 8:17 checkpoint from public archive"
          git pull --rebase origin main
          git push
