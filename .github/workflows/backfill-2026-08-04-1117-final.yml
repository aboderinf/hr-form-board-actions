name: Final August 4 11:17 checkpoint recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/triggers/backfill-2026-08-04-1117-final.txt"

permissions:
  contents: write

concurrency:
  group: final-backfill-2026-08-04-1117
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-50b0-820c-a5a7-08fc2ee6b25b/raw?se=2026-08-05T03:04:46Z&sp=r&sv=2026-02-06&sr=b&scid=f702e8c3-6218-5e39-8b7f-9377ff03d31c&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T22:08:52Z&ske=2026-08-05T22:08:52Z&sks=b&skv=2026-02-06&sig=4%2BEkPbbDmWBXSyBvY4wn9LN1QukUik4Dw0TZJWHOjJ8%3D"
      EXPECTED_HASH: "09da49e9eda771c9ce0106481c3a1796f1a30f350b9938985d3de54b40295b4b"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download exact source recovery database
        run: |
          rm -rf /tmp/mlb-source /tmp/mlb-source.zip
          mkdir -p /tmp/mlb-source
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/mlb-source.zip
          unzip -q /tmp/mlb-source.zip -d /tmp/mlb-source
          test -s /tmp/mlb-source/shared/provider_calls.sqlite3

      - name: Reconstruct exact sanitized checkpoint
        run: |
          python scripts/backfill_shared_odds_from_sqlite.py \
            --database /tmp/mlb-source/shared/provider_calls.sqlite3 \
            --date 2026-08-04 \
            --checkpoint 11:17 \
            --expected-hash "$EXPECTED_HASH"
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('data/shared-odds/archive/2026-08-04_1117.json').read_text())
          assert feed['rowCount'] == 249
          assert feed['quoteCount'] == 707
          assert feed['allAvailableQuoteCount'] == 1414
          assert feed['excludedLiveOrPostStartQuoteCount'] == 0
          PY

      - name: Validate only affected consumer contracts
        run: |
          python -m unittest discover -s tests -p 'test_edge_source.py' -v
          python -m unittest discover -s tests -p 'test_source_driven_refresh.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v

      - name: Rebuild checkpoint, Top 100, and time-column history
        run: |
          python scripts/run_source_driven_refresh.py \
            --date 2026-08-04 \
            --checkpoint 11:17 \
            --attempts 1 \
            --delay 0

      - name: Require populated 11:17 Top 100 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          capture_path = Path('data/discovery/archive/2026-08-04_1117.json')
          capture = json.loads(capture_path.read_text())
          assert capture['slate_date'] == '2026-08-04'
          assert capture['checkpoint'] == '1117'
          assert capture['top100_rows'] == 100
          assert capture['priced_rows'] > 0
          assert any(entry.get('best_odds') is not None for entry in capture['entries'])
          top100 = json.loads(Path('data/top100.json').read_text())
          priced = sum(1 for player in top100.get('players', []) if player.get('odds_available'))
          assert priced > 0
          pipeline = json.loads(Path('data/pipeline-status.json').read_text())
          assert pipeline['status'] == 'success'
          assert pipeline['top100_checkpoint_priced_rows'] == capture['priced_rows']
          print({
              'source_quotes': 707,
              'top100_current_priced': priced,
              'top100_checkpoint_priced': capture['priced_rows'],
          })
          PY

      - name: Commit recovered checkpoint atomically
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git commit -m "Backfill August 4 11:17 Top 100 odds"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
