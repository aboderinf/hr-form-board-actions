name: Build Triples Profit Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/triples-discovery.yml"
      - "src/discovery.py"
      - "src/triples.py"
      - "src/triples_discovery.py"
      - "src/triples_model_discovery.py"
      - "src/triples_settlement.py"
      - "src/sources.py"
      - "scripts/build_triples_discovery.py"
      - "tests/test_triples_discovery.py"
      - "tests/test_triples_model_discovery.py"
      - "tests/test_triples_settlement.py"
  schedule:
    # 1:35 AM ET, after the prior slate can be settled. Separate UTC entries
    # let the gate use the scheduled expression even when GitHub starts late.
    - cron: "35 5 * 3-11 *"
    - cron: "35 6 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: triples-profit-discovery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ET build window
        id: window
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          manual_or_code_change = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          scheduled_cron = os.environ.get("SCHEDULED_CRON", "")
          expected_cron = "35 5 * 3-11 *" if now.dst() else "35 6 * 3-11 *"
          due = manual_or_code_change or scheduled_cron == expected_cron
          print(f"due={'true' if due else 'false'}")
          print(f"today={now.date().isoformat()}")
          print(f"observed_et={now.isoformat()}")
          print(f"scheduled_cron={scheduled_cron}")
          print(f"expected_cron={expected_cron}")
          PY

      - name: Skip duplicate UTC invocation
        if: steps.window.outputs.due != 'true'
        run: echo "This scheduled UTC invocation is not the 1:35 AM ET build; skipping."

      - uses: actions/setup-python@v5
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Test Triples Discovery contracts
        if: steps.window.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_triples_discovery.py' -v
          python -m unittest discover -s tests -p 'test_triples_model_discovery.py' -v
          python -m unittest discover -s tests -p 'test_triples_settlement.py' -v

      - name: Backfill archives, settle outcomes, and build reports
        if: steps.window.outputs.due == 'true'
        run: python scripts/build_triples_discovery.py --today "${{ steps.window.outputs.today }}"

      - name: Commit Triples Discovery data
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No Triples Discovery changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/triples-discovery.json data/triples-discovery/archive \
            data/triples-model-discovery.json data/triples-model-discovery/archive
          git commit -m "Update Triples discovery feeds"
          git pull --rebase origin main
          git push
