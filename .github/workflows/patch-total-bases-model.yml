name: Patch total bases v2 serving

on:
  push:
    paths:
      - .github/workflows/patch-total-bases-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch v2 archived identity and compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/total-bases-v2-handler.js')
          text = path.read_text()
          replacements = {
              "compactName(row.player || row.player_key)": "compactName(row.player_key || row.player)",
              "v2Probability: Number(probability.toFixed(4)), v1Probability: row.modelProbability, formProbability: row.formProbability,": "v2Probability: Number(probability.toFixed(4)), modelProbability: Number(probability.toFixed(4)), v1Probability: row.modelProbability, formProbability: row.formProbability,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected patch target missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check lib/total-bases-v2-handler.js
      - name: Commit patch
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/total-bases-v2-handler.js
          git commit -m "Fix Total Bases v2 archived identity matching"
          git push origin HEAD:main
