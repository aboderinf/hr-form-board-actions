name: Match total bases v2 validation population

on:
  push:
    paths:
      - .github/workflows/patch-total-bases-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expose v1 archived holdout rows and match v2 exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          v1 = Path('lib/total-bases-model-handler.js')
          text = v1.read_text()
          replacements = {
              "const MODEL_VERSION = 'v1.2';": "const MODEL_VERSION = 'v1.3';",
              "      kind: 'batter_two_plus_total_bases_model_v1_2',": "      kind: 'batter_two_plus_total_bases_model_v1_3',",
              "    const holdoutMarketRows = archiveEvaluation.filter((row) => holdoutStart && row.date >= holdoutStart && row.date <= through);\n    const strategy = tuneStrategy(calibrationMarketRows);": "    const holdoutMarketRows = archiveEvaluation.filter((row) => holdoutStart && row.date >= holdoutStart && row.date <= through);\n    const holdoutProbabilityByPlayerDate = new Map();\n    for (const row of holdoutMarketRows) {\n      const key = `${row.date}|${row.batterId}`;\n      if (!holdoutProbabilityByPlayerDate.has(key)) {\n        holdoutProbabilityByPlayerDate.set(key, {\n          date: row.date, batterId: row.batterId, batterName: row.batterName, hit: row.hit,\n          modelProbability: row.modelProbability, formProbability: row.formProbability,\n        });\n      }\n    }\n    const holdoutProbabilityRows = [...holdoutProbabilityByPlayerDate.values()];\n    const strategy = tuneStrategy(calibrationMarketRows);",
              "        holdoutByCheckpoint: byCheckpoint,\n      },": "        holdoutByCheckpoint: byCheckpoint,\n        holdoutProbabilityRows,\n      },",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'v1 patch target missing: {old[:140]}')
              text = text.replace(old, new, 1)
          v1.write_text(text)

          v2 = Path('lib/total-bases-v2-handler.js')
          text = v2.read_text()
          marker = "function strategySummary(rows) {\n"
          if marker not in text:
              raise SystemExit('v2 metrics insertion marker missing')
          metrics_fn = r'''function probabilityMetrics(rows, field) {
            const usable = rows.filter((row) => Number.isFinite(Number(row[field])) && [0, 1].includes(Number(row.hit)));
            if (!usable.length) return { n: 0, brier: null, log_loss: null, average_probability: null, hit_rate: null, calibration_gap: null };
            let brier = 0; let loss = 0; let wins = 0; let probabilitySum = 0;
            for (const row of usable) {
              const y = Number(row.hit);
              const p = Math.max(.001, Math.min(.999, Number(row[field])));
              wins += y; probabilitySum += p; brier += (p - y) ** 2;
              loss += -(y * Math.log(p) + (1 - y) * Math.log(1 - p));
            }
            const averageProbability = probabilitySum / usable.length;
            const hitRate = wins / usable.length;
            return {
              n: usable.length,
              brier: Number((brier / usable.length).toFixed(5)),
              log_loss: Number((loss / usable.length).toFixed(5)),
              average_probability: Number(averageProbability.toFixed(4)),
              hit_rate: Number(hitRate.toFixed(4)),
              calibration_gap: Number((averageProbability - hitRate).toFixed(4)),
            };
          }

          function strategySummary(rows) {
'''
          text = text.replace(marker, metrics_fn, 1)

          old = """    const v1 = v1Result.statusCode === 200 ? v1Result.body : null;\n    const offline = loaded.performance.holdout || {};\n    const v2Metrics = offline.v2 || {};\n    const formMetrics = offline.form || {};\n    const v1Metrics = v1?.validation?.modelProbability || {};\n    const sameSplit = String(v1?.split?.holdoutStart || '') === String(offline.start || HOLDOUT_START);\n    const probabilityPass = Boolean(\n      sameSplit\n      && Number.isFinite(Number(v2Metrics.brier)) && Number.isFinite(Number(v1Metrics.brier)) && Number.isFinite(Number(formMetrics.brier))\n      && Number(v2Metrics.brier) < Number(v1Metrics.brier) && Number(v2Metrics.brier) < Number(formMetrics.brier)\n      && Number(v2Metrics.log_loss) < Number(v1Metrics.logLoss) && Number(v2Metrics.log_loss) < Number(formMetrics.log_loss)\n    );"""
          new = """    const v1 = v1Result.statusCode === 200 ? v1Result.body : null;\n    const offline = loaded.performance.holdout || {};\n    const offlineV2Metrics = offline.v2 || {};\n    const offlineFormMetrics = offline.form || {};\n    const v2ByPlayerDate = new Map((loaded.predictions || []).map((row) => [`${row.date}|${Number(row.batter_id)}`, row]));\n    const matchedRows = [];\n    for (const row of v1?.validation?.holdoutProbabilityRows || []) {\n      const v2Row = v2ByPlayerDate.get(`${row.date}|${Number(row.batterId)}`);\n      if (!v2Row || !Number.isFinite(Number(v2Row.probability))) continue;\n      matchedRows.push({\n        date: row.date, batterId: Number(row.batterId), hit: Number(row.hit),\n        v2Probability: Number(v2Row.probability), v1Probability: Number(row.modelProbability), formProbability: Number(row.formProbability),\n      });\n    }\n    const v2Metrics = probabilityMetrics(matchedRows, 'v2Probability');\n    const v1Matched = probabilityMetrics(matchedRows, 'v1Probability');\n    const formMetrics = probabilityMetrics(matchedRows, 'formProbability');\n    const v1Metrics = { ...v1Matched, logLoss: v1Matched.log_loss };\n    const sameSplit = String(v1?.split?.holdoutStart || '') === String(offline.start || HOLDOUT_START);\n    const probabilityPass = Boolean(\n      sameSplit && matchedRows.length >= 500\n      && Number.isFinite(Number(v2Metrics.brier)) && Number.isFinite(Number(v1Metrics.brier)) && Number.isFinite(Number(formMetrics.brier))\n      && Number(v2Metrics.brier) < Number(v1Metrics.brier) && Number(v2Metrics.brier) < Number(formMetrics.brier)\n      && Number(v2Metrics.log_loss) < Number(v1Metrics.logLoss) && Number(v2Metrics.log_loss) < Number(formMetrics.log_loss)\n    );"""
          if old not in text:
              raise SystemExit('v2 matched comparison block missing')
          text = text.replace(old, new, 1)

          old = """        v2: v2Metrics, v1: v1Metrics, form: formMetrics,\n        improvementVsForm: offline.improvement_vs_form || null,\n        outOfTime2025: loaded.performance.out_of_time_2025 || null,"""
          new = """        v2: v2Metrics, v1: v1Metrics, form: formMetrics,\n        improvementVsForm: {\n          brier: v2Metrics.brier == null || formMetrics.brier == null ? null : Number((formMetrics.brier - v2Metrics.brier).toFixed(5)),\n          log_loss: v2Metrics.log_loss == null || formMetrics.log_loss == null ? null : Number((formMetrics.log_loss - v2Metrics.log_loss).toFixed(5)),\n        },\n        statcastHoldoutAll: { v2: offlineV2Metrics, form: offlineFormMetrics },\n        outOfTime2025: loaded.performance.out_of_time_2025 || null,"""
          if old not in text:
              raise SystemExit('v2 validation output block missing')
          text = text.replace(old, new, 1)

          old = """        observations: loaded.performance.observations, stateAsOf: loaded.state.as_of,\n        archiveMarketRows: evaluation.length, calibrationMarketRows: calibrationMarket.length, holdoutMarketRows: holdoutMarket.length,"""
          new = """        observations: loaded.performance.observations, stateAsOf: loaded.state.as_of, matchedHoldoutRows: matchedRows.length,\n        archiveMarketRows: evaluation.length, calibrationMarketRows: calibrationMarket.length, holdoutMarketRows: holdoutMarket.length,"""
          if old not in text:
              raise SystemExit('v2 data quality block missing')
          text = text.replace(old, new, 1)
          v2.write_text(text)
          PY
          node --check lib/total-bases-model-handler.js
          node --check lib/total-bases-v2-handler.js
      - name: Commit patch
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/total-bases-model-handler.js lib/total-bases-v2-handler.js
          git commit -m "Compare Total Bases models on matched holdout rows"
          git push origin HEAD:main
