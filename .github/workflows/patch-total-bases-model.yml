name: Match Total Bases validation population

on:
  push:
    paths:
      - .github/workflows/patch-total-bases-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply matched validation patch
        run: python scripts/patch_total_bases_matched_validation.py
      - name: Check syntax
        run: |
          node --check lib/total-bases-model-handler.js
          node --check lib/total-bases-v2-handler.js
      - name: Commit patch
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/total-bases-model-handler.js lib/total-bases-v2-handler.js
          git commit -m "Compare Total Bases models on matched holdout rows"
          git push origin HEAD:main
