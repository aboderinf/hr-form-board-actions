name: Freeze total bases v1 holdout

on:
  push:
    paths:
      - .github/workflows/patch-total-bases-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Freeze v1 validation split at August 17
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/total-bases-model-handler.js')
          text = path.read_text()
          replacements = {
              "const MODEL_VERSION = 'v1.1';": "const MODEL_VERSION = 'v1.2';",
              "    const splitIndex = settledDates.length >= 2 ? Math.max(1, Math.min(settledDates.length - 1, Math.floor(settledDates.length * 0.60))) : null;\n    const holdoutStart = splitIndex == null ? null : settledDates[splitIndex];": "    const fixedHoldoutStart = '2026-08-17';\n    const splitIndex = settledDates.length >= 2 ? Math.max(1, Math.min(settledDates.length - 1, Math.floor(settledDates.length * 0.60))) : null;\n    const holdoutStart = settledDates.some((value) => value >= fixedHoldoutStart)\n      ? fixedHoldoutStart\n      : (splitIndex == null ? null : settledDates[splitIndex]);",
              "      kind: 'batter_two_plus_total_bases_model_v1_1',": "      kind: 'batter_two_plus_total_bases_model_v1_2',",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected patch target missing: {old[:120]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check lib/total-bases-model-handler.js
      - name: Commit patch
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/total-bases-model-handler.js
          git commit -m "Freeze Total Bases v1 holdout at Aug 17"
          git push origin HEAD:main
