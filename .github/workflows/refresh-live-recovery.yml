name: Refresh live Form Board surfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/triggers/refresh-live-now.txt"

permissions:
  contents: write

concurrency:
  group: refresh-live-form-board-surfaces
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate latest-source and Top 100 odds contracts
        run: |
          python -m unittest discover -s tests -p 'test_edge_source.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v
          python -m unittest discover -s tests -p 'test_public_mirror_fallback.py' -v

      - name: Refresh Today from the latest database-backed slate
        run: python scripts/refresh_latest.py

      - name: Refresh Top 100 odds without rescoring hitters
        run: python scripts/build_top100.py --odds-only

      - name: Commit refreshed live surfaces
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/index.json data/top100.json index.html
          if git diff --cached --quiet; then
            echo "No live surface changes."
            exit 0
          fi
          git commit -m "Refresh Today and Top 100 odds from live database"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
