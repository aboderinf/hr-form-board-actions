name: Refresh latest shared slate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-latest.yml"
      - "src/edge_source.py"
      - "scripts/refresh_latest.py"
  schedule:
    # Recovery-only fallback after the source-driven all-surface refresh.
    - cron: "47 12,15,21 * 3-11 *"
    - cron: "47 0 * 3-11 *"
    - cron: "47 13,16,22 * 3-11 *"
    - cron: "47 1 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: refresh-latest-shared-slate
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scheduled runners can start late. Never decide whether a scheduled
      # refresh is due from the runner's wall clock; the cron event itself is
      # the authorization to refresh, and duplicate DST schedules are idempotent.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read latest MLB HR Edge slate and rebuild Today
        run: python scripts/refresh_latest.py
      - name: Validate only latest-source parsing
        run: |
          python -m unittest discover -s tests -p 'test_edge_source.py' -v
          python -m unittest discover -s tests -p 'test_durable_source.py' -v
          python -m unittest discover -s tests -p 'test_public_mirror_fallback.py' -v
      - name: Commit current board
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No latest-slate changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/index.json index.html
          git commit -m "Refresh latest MLB HR Edge slate"
          git pull --rebase origin main
          git push
