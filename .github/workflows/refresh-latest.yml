name: Refresh latest shared slate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-latest.yml"
      - "src/edge_source.py"
      - "scripts/refresh_latest.py"
  schedule:
    # Run five minutes after MLB HR Edge's 8:17, 11:17, 5:17 and 8:17 ET fetches.
    # EDT: 08:22=12:22Z, 11:22=15:22Z, 17:22=21:22Z, 20:22=00:22Z.
    - cron: "22 12,15,21 * 3-11 *"
    - cron: "22 0 * 3-11 *"
    # EST equivalents; the ET gate below skips the duplicate offset invocation.
    - cron: "22 13,16,22 * 3-11 *"
    - cron: "22 1 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: refresh-latest-shared-slate
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve valid ET refresh window
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          manual = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          due = manual or now.hour in {8, 11, 17, 20}
          print(f"due={'true' if due else 'false'}")
          print(f"observed_et={now.isoformat()}")
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt
      - name: Read latest MLB HR Edge slate and rebuild Today
        if: steps.window.outputs.due == 'true'
        run: python scripts/refresh_latest.py
      - name: Validate scoring and source parsing
        if: steps.window.outputs.due == 'true'
        run: python -m unittest discover -s tests -v
      - name: Commit current board
        if: steps.window.outputs.due == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No latest-slate changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/index.json index.html
          git commit -m "Refresh latest MLB HR Edge slate"
          git push
