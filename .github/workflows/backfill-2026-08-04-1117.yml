name: Backfill August 4 11:17 checkpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/triggers/backfill-2026-08-04-1117.txt"

permissions:
  contents: write

concurrency:
  group: backfill-2026-08-04-1117
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-b9a8-822f-af00-9632dfca501e/raw?se=2026-08-05T02:57:39Z&sp=r&sv=2026-02-06&sr=b&scid=f43ee124-7851-5498-8ffa-5a81bdfcc5a4&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T22:10:51Z&ske=2026-08-05T22:10:51Z&sks=b&skv=2026-02-06&sig=n4TxVtu60L0J8fGqcES0UYXJA1G8Bkq7xEvSeYYL%2BOw%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download exact source recovery artifact
        run: |
          rm -rf /tmp/mlb-source /tmp/mlb-source.zip
          mkdir -p /tmp/mlb-source
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/mlb-source.zip
          unzip -q /tmp/mlb-source.zip -d /tmp/mlb-source
          test -s /tmp/mlb-source/shared/provider_calls.sqlite3
          test -s /tmp/mlb-source/daily/payload_20260804.json

      - name: Reconstruct sanitized 11:17 feed from SQLite
        run: |
          python - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import sqlite3

          DB = Path('/tmp/mlb-source/shared/provider_calls.sqlite3')
          OUT = Path('data/shared-odds')
          EXPECTED_HASH = '09da49e9eda771c9ce0106481c3a1796f1a30f350b9938985d3de54b40295b4b'
          BOOKS = ['fanduel', 'draftkings', 'betmgm']

          def parse_time(value):
              if not value:
                  return None
              parsed = datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              return parsed if parsed.tzinfo else parsed.replace(tzinfo=timezone.utc)

          def normalize(value):
              value = str(value or '').lower().replace('’', "'")
              value = re.sub(r"\b(jr|sr|ii|iii|iv)\.?\b", '', value)
              return re.sub(r'[^a-z0-9]+', ' ', value).strip()

          con = sqlite3.connect(DB)
          con.row_factory = sqlite3.Row
          try:
              assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              call = con.execute(
                  "SELECT * FROM api_calls WHERE game_date=? AND checkpoint_label=? ORDER BY completed_at DESC LIMIT 1",
                  ('2026-08-04', '1117'),
              ).fetchone()
              if call is None:
                  raise SystemExit('Archived 2026-08-04 11:17 call not found')
              if call['response_sha256'] != EXPECTED_HASH:
                  raise SystemExit('Provider response hash does not match the exact archived call')

              full = json.loads(call['full_payload_json'])
              by_name = defaultdict(list)
              for prediction in full.get('predictions') or []:
                  by_name[normalize(prediction.get('batterName'))].append(prediction)

              quotes = con.execute(
                  """
                  SELECT player_name, player_key, bookmaker, american_odds, captured_at,
                         source_event_id, source_odd_id, game_start_at, home_team, away_team
                  FROM market_quotes WHERE call_id=? ORDER BY captured_at DESC
                  """,
                  (call['call_id'],),
              ).fetchall()

              latest = {}
              excluded = 0
              for quote in quotes:
                  captured = parse_time(quote['captured_at'])
                  starts = parse_time(quote['game_start_at'])
                  if not captured or not starts or captured >= starts:
                      excluded += 1
                      continue
                  key = (quote['player_key'], quote['source_event_id'], quote['bookmaker'])
                  latest.setdefault(key, quote)

              groups = {}
              for (player_key, event_id, bookmaker), quote in latest.items():
                  group = groups.setdefault((player_key, event_id), {
                      'playerKey': player_key,
                      'sourceEventId': event_id,
                      'playerName': quote['player_name'],
                      'gameStartAt': quote['game_start_at'],
                      'homeTeam': quote['home_team'],
                      'awayTeam': quote['away_team'],
                      'odds': {},
                  })
                  group['odds'][bookmaker] = {
                      'americanOdds': quote['american_odds'],
                      'capturedAt': quote['captured_at'],
                      'source': 'sportsgameodds-archive',
                      'sourceEventId': event_id,
                      'sourceOddId': quote['source_odd_id'],
                      'callId': call['call_id'],
                  }

              rows = []
              for group in groups.values():
                  predictions = by_name.get(normalize(group['playerName']), [])
                  prediction = predictions[0] if predictions else None
                  matchup = ' @ '.join(v for v in [group['awayTeam'], group['homeTeam']] if v) or None
                  rows.append({
                      'predictionId': f"{call['game_date']}:{prediction.get('batterId')}" if prediction and prediction.get('batterId') else None,
                      'gameDate': call['game_date'],
                      'gamePk': prediction.get('gamePk') if prediction else None,
                      'gameStartAt': group['gameStartAt'] or (prediction.get('gameStartAt') if prediction else None),
                      'batterId': prediction.get('batterId') if prediction else None,
                      'batterName': prediction.get('batterName') if prediction else group['playerName'],
                      'batterTeam': prediction.get('batterTeam') if prediction else None,
                      'matchup': prediction.get('matchup') if prediction else matchup,
                      'lineupPosition': prediction.get('lineupPosition') if prediction else None,
                      'lineupConfirmed': bool(prediction and prediction.get('lineupConfirmed')),
                      'playerKey': group['playerKey'],
                      'sourceEventId': group['sourceEventId'],
                      'odds': group['odds'],
                  })
              rows.sort(key=lambda row: str(row.get('batterName') or ''))
              selected = [q for row in rows for q in row['odds'].values()]
              generated_at = max((str(q['capturedAt']) for q in selected), default=call['completed_at'])
              feed = {
                  'schemaVersion': 2,
                  'date': call['game_date'],
                  'checkpoint': call['checkpoint_label'],
                  'asOf': call['completed_at'],
                  'generatedAt': generated_at,
                  'latestIngestAt': call['completed_at'],
                  'status': 'ready' if rows else 'pending',
                  'source': 'mlb-hr-edge-database',
                  'delivery': 'source-artifact-recovery-backfill',
                  'books': BOOKS,
                  'rowCount': len(rows),
                  'quoteCount': len(selected),
                  'allAvailableQuoteCount': len(quotes),
                  'excludedLiveOrPostStartQuoteCount': excluded,
                  'archivedCallCount': 1,
                  'providerCallId': call['call_id'],
                  'providerResponseSha256': call['response_sha256'],
                  'rows': rows,
              }
              assert feed['rowCount'] == 249, feed['rowCount']
              assert feed['quoteCount'] == 707, feed['quoteCount']
              assert feed['allAvailableQuoteCount'] == 1414, feed['allAvailableQuoteCount']
              assert feed['excludedLiveOrPostStartQuoteCount'] == 0, feed['excludedLiveOrPostStartQuoteCount']

              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / 'archive').mkdir(parents=True, exist_ok=True)
              text = json.dumps(feed, indent=2) + '\n'
              (OUT / 'archive' / '2026-08-04_1117.json').write_text(text, encoding='utf-8')
              (OUT / 'latest.json').write_text(text, encoding='utf-8')
              print(json.dumps({k: feed[k] for k in [
                  'date','checkpoint','rowCount','quoteCount','allAvailableQuoteCount',
                  'excludedLiveOrPostStartQuoteCount','providerCallId','providerResponseSha256'
              ]}, indent=2))
          finally:
              con.close()
          PY

      - name: Validate consumer contracts
        run: |
          python -m unittest discover -s tests -p 'test_edge_source.py' -v
          python -m unittest discover -s tests -p 'test_source_driven_refresh.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v

      - name: Rebuild the exact frozen checkpoint and live surfaces
        run: |
          python scripts/run_source_driven_refresh.py \
            --date 2026-08-04 \
            --checkpoint 11:17 \
            --attempts 1 \
            --delay 0

      - name: Verify checkpoint populated with prices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('data/shared-odds/archive/2026-08-04_1117.json').read_text())
          assert feed['quoteCount'] == 707
          index = json.loads(Path('data/index.json').read_text())
          snapshots = index.get('snapshots') or []
          matching = [s for s in snapshots if str(s.get('date') or s.get('slate_date')) == '2026-08-04' and str(s.get('checkpoint') or '').replace(':','') == '1117']
          if not matching:
              raise SystemExit('11:17 frozen snapshot was not added to the checkpoint ledger')
          top100 = json.loads(Path('data/top100.json').read_text())
          priced = sum(1 for player in (top100.get('players') or []) if player.get('odds_available'))
          print({'checkpoint_quotes': feed['quoteCount'], 'top100_priced_players': priced})
          PY

      - name: Commit recovered checkpoint atomically
        run: |
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git commit -m "Backfill August 4 11:17 odds checkpoint"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
