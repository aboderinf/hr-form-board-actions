name: Refresh Top 100 Scores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/top100.yml"
      - "scripts/build_hr_top100.py"
      - "scripts/build_top100.py"
      - "scripts/build_triples_model.py"
      - "src/model.py"
      - "src/sources.py"
      - "src/edge_source.py"
      - "src/durable_source.py"
      - "src/top100_view.py"
      - "src/triples.py"
      - "src/triples_model.py"
      - "tests/test_open_pool.py"
      - "tests/test_top100_view.py"
      - "tests/test_triples.py"
      - "tests/test_triples_model.py"
  schedule:
    - cron: "5 8,10 * 3-11 *"
    - cron: "5 9,11 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: refresh-top-100-scores
  cancel-in-progress: false

jobs:
  hr_form:
    name: Publish HR Form
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ET slate
        id: slate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(f"date={datetime.now(ZoneInfo('America/New_York')).date().isoformat()}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Test HR Form contracts only
        run: |
          python -m unittest discover -s tests -p 'test_open_pool.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v

      - name: Build today's HR Top 100
        run: python scripts/build_hr_top100.py --date "${{ steps.slate.outputs.date }}"

      - name: Require today's HR slate
        env:
          EXPECTED_SLATE: ${{ steps.slate.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ["EXPECTED_SLATE"]
          payload = json.loads(Path("data/top100.json").read_text(encoding="utf-8"))
          if payload.get("slate_date") != expected:
              raise SystemExit(f"HR Top 100 slate mismatch: expected {expected}, got {payload.get('slate_date')}")
          if payload.get("status") not in {"ready", "no_players_in_form"}:
              raise SystemExit(f"HR Top 100 build unusable: {payload.get('status')}")
          print(f"HR Top 100 advanced to {expected} with {len(payload.get('players') or [])} rows")
          PY

      - name: Commit HR Form immediately
        run: |
          if git diff --quiet -- data/top100.json; then
            echo "No HR Form changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/top100.json
          git commit -m "Advance HR Form daily slate"
          git pull --rebase origin main
          git push

  triples:
    name: Refresh Triples independently
    needs: hr_form
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ET slate
        id: slate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(f"date={datetime.now(ZoneInfo('America/New_York')).date().isoformat()}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: pip install -r requirements.txt

      - name: Test Triples contracts
        run: |
          python -m unittest discover -s tests -p 'test_triples.py' -v
          python -m unittest discover -s tests -p 'test_triples_model.py' -v

      - name: Build Triples form board
        run: python scripts/build_top100.py --date "${{ steps.slate.outputs.date }}"

      - name: Build Triples model board
        run: python scripts/build_triples_model.py --date "${{ steps.slate.outputs.date }}"

      - name: Require today's Triples slate
        env:
          EXPECTED_SLATE: ${{ steps.slate.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ["EXPECTED_SLATE"]
          triples = json.loads(Path("data/triples-top100.json").read_text(encoding="utf-8"))
          model = json.loads(Path("data/triples-model.json").read_text(encoding="utf-8"))
          if triples.get("slate_date") != expected:
              raise SystemExit(f"Triples Top 100 slate mismatch: expected {expected}, got {triples.get('slate_date')}")
          if triples.get("status") not in {"ready", "no_players_in_form"}:
              raise SystemExit(f"Triples Top 100 unusable: {triples.get('status')}")
          if model.get("slate_date") != expected:
              raise SystemExit(f"Triples model slate mismatch: expected {expected}, got {model.get('slate_date')}")
          if model.get("status") not in {"ready", "no_scheduled_players"}:
              raise SystemExit(f"Triples model unusable: {model.get('status')}")
          if int(model.get("sports_game_odds_objects_added") or 0) != 0:
              raise SystemExit("Triples model must not add SportsGameOdds objects")
          PY

      - name: Commit Triples outputs
        run: |
          if git diff --quiet -- data/triples-top100.json data/triples-model.json data/triples-model/state-parts; then
            echo "No Triples changes."
            exit 0
          fi
          git config user.name "triples-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/triples-top100.json data/triples-model.json data/triples-model/state-parts
          git commit -m "Advance Triples daily slate"
          git pull --rebase origin main
          git push
