name: Refresh Top 100 Scores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/top100.yml"
      - "app.js"
      - "scores-enhancements.js"
      - "index.html"
      - "style.css"
      - "src/model.py"
      - "src/sources.py"
      - "src/edge_source.py"
      - "src/durable_source.py"
      - "src/top100_view.py"
      - "scripts/build_top100.py"
      - "tests/test_open_pool.py"
      - "tests/test_top100_view.py"
  schedule:
    # Full daily rebuild at 4:05 AM ET so the new slate is ready before 8:17.
    # A 6:05 AM ET invocation is recovery-only and skips when today's board exists.
    # EDT equivalents.
    - cron: "5 8,10 * 3-11 *"
    # EST equivalents. ET-hour gating below rejects the duplicate offset run.
    - cron: "5 9,11 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: refresh-top-100-scores
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ET daily or recovery run
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          manual_or_code_change = event != "schedule"
          due = False
          mode = "skip"

          if manual_or_code_change:
              due = True
              mode = "manual_or_code_change"
          elif now.hour == 4:
              due = True
              mode = "daily_0405"
          elif now.hour == 6:
              path = Path("data/top100.json")
              current_slate = None
              if path.exists():
                  try:
                      current_slate = json.loads(path.read_text(encoding="utf-8")).get("slate_date")
                  except Exception:
                      current_slate = None
              due = current_slate != now.date().isoformat()
              mode = "recovery_0605" if due else "recovery_not_needed"

          print(f"due={'true' if due else 'false'}")
          print(f"mode={mode}")
          print(f"slate_date={now.date().isoformat()}")
          print(f"observed_et={now.isoformat()}")
          PY

      - name: Skip duplicate or unnecessary recovery run
        if: steps.window.outputs.due != 'true'
        run: echo "Skipping ${{ steps.window.outputs.mode }} at ${{ steps.window.outputs.observed_et }}."

      - uses: actions/setup-python@v5
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Test only daily leaderboard contracts
        if: steps.window.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_open_pool.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v

      - name: Build today's Top 100 leaderboard
        if: steps.window.outputs.due == 'true'
        run: python scripts/build_top100.py --date "${{ steps.window.outputs.slate_date }}"

      - name: Require today's slate
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_SLATE"]
          payload = json.loads(Path("data/top100.json").read_text(encoding="utf-8"))
          actual = payload.get("slate_date")
          if actual != expected:
              raise SystemExit(f"Top 100 slate mismatch: expected {expected}, got {actual}")
          if payload.get("status") not in {"ready", "no_players_in_form"}:
              raise SystemExit(f"Top 100 build was not usable: {payload.get('status')}")
          print(f"Top 100 advanced to {actual} with {len(payload.get('players') or [])} rows")
          PY
        env:
          EXPECTED_SLATE: ${{ steps.window.outputs.slate_date }}

      - name: Commit leaderboard
        if: steps.window.outputs.due == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No Top 100 changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/top100.json
          git commit -m "Advance Top 100 daily slate"
          git pull --rebase origin main
          git push
