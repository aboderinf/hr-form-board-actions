name: Refresh Top 100 Scores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/top100.yml"
      - "app.js"
      - "scores-enhancements.js"
      - "index.html"
      - "style.css"
      - "src/model.py"
      - "src/sources.py"
      - "src/edge_source.py"
      - "src/durable_source.py"
      - "src/top100_view.py"
      - "scripts/build_top100.py"
      - "tests/test_open_pool.py"
      - "tests/test_top100_view.py"
      - "tests/test_durable_source.py"
      - "tests/test_edge_source.py"
      - "tests/test_public_mirror_fallback.py"
  schedule:
    - cron: "25 12,15,21 * 3-11 *"
    - cron: "25 0 * 3-11 *"
    - cron: "25 13,16,22 * 3-11 *"
    - cron: "25 1 * 3-11 *"

permissions:
  contents: write

concurrency:
  group: refresh-top-100-scores
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve ET window
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          manual = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          due = manual or now.hour in {8, 11, 17, 20}
          print(f"due={'true' if due else 'false'}")
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.window.outputs.due == 'true'
        run: pip install -r requirements.txt
      - name: Test only Top 100 ranking and shared-odds contracts
        if: steps.window.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_open_pool.py' -v
          python -m unittest discover -s tests -p 'test_top100_view.py' -v
          python -m unittest discover -s tests -p 'test_edge_source.py' -v
          python -m unittest discover -s tests -p 'test_durable_source.py' -v
          python -m unittest discover -s tests -p 'test_public_mirror_fallback.py' -v
      - name: Build Top 100 leaderboard with optional shared odds
        if: steps.window.outputs.due == 'true'
        run: python scripts/build_top100.py
      - name: Commit leaderboard
        if: steps.window.outputs.due == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No Top 100 changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/top100.json
          git commit -m "Refresh Top 100 form scores and odds"
          git pull --rebase origin main
          git push
