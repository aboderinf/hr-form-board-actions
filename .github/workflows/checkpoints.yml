name: HR form checkpoints

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Optional YYYY-MM-DD manual slate date
        required: false
      checkpoint:
        description: Optional ET checkpoint (08:17, 11:17, 17:17, 20:17)
        required: false
  push:
    branches: [main]
    paths:
      - "data/triggers/run-checkpoint-now.txt"
  schedule:
    # MLB HR Edge starts its one shared provider fetch at :17. The consumer runs
    # at :32 so the source request, archive and ingest can finish first.
    # run_checkpoint.py still resolves and freezes the corresponding :17 label.
    - cron: '32 12,15,21 * 3-11 *'
    - cron: '32 0 * 3-11 *'
    - cron: '32 13,16,22 * 3-11 *'
    - cron: '32 1 * 3-11 *'

permissions:
  contents: write

concurrency:
  group: hr-form-checkpoint
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run checkpoint and settle prior picks
        env:
          MANUAL_DATE: ${{ github.event.inputs.slate_date }}
          MANUAL_CHECKPOINT: ${{ github.event.inputs.checkpoint }}
        run: |
          if [ -n "$MANUAL_DATE" ] && [ -n "$MANUAL_CHECKPOINT" ]; then
            python scripts/run_checkpoint.py --date "$MANUAL_DATE" --checkpoint "$MANUAL_CHECKPOINT"
          else
            python scripts/run_checkpoint.py
          fi
      - name: Validate
        run: python -m unittest discover -s tests -v
      - name: Commit immutable ledger updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git commit -m "Update HR form checkpoint ledger"
          git pull --rebase origin main
          git push
