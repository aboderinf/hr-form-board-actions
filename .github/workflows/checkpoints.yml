name: HR form checkpoints

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Optional YYYY-MM-DD manual slate date
        required: false
      checkpoint:
        description: Optional ET checkpoint (08:17, 11:17, 17:17, 20:17)
        required: false
  push:
    branches: [main]
    paths:
      - "data/triggers/run-checkpoint-now.txt"
  schedule:
    # Recovery fallback after the primary source-driven refresh. Native ET
    # scheduling removes duplicate DST/UTC cron entries.
    - cron: '51 8,11,17,20 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: hr-form-checkpoint
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install checkpoint runtime
        run: pip install -r requirements.txt
      - name: Run checkpoint and settle prior picks
        env:
          MANUAL_DATE: ${{ github.event.inputs.slate_date }}
          MANUAL_CHECKPOINT: ${{ github.event.inputs.checkpoint }}
        run: |
          if [ -n "$MANUAL_DATE" ] && [ -n "$MANUAL_CHECKPOINT" ]; then
            python scripts/run_checkpoint.py --date "$MANUAL_DATE" --checkpoint "$MANUAL_CHECKPOINT"
          else
            python scripts/run_checkpoint.py
          fi
      - name: Commit immutable ledger updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "hr-form-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html
          git commit -m "Update HR form checkpoint ledger"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
